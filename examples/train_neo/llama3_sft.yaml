# Model configuration and KD
model_name_or_path: meta-llama/Llama-3.2-1B-Instruct


# Training methodology
stage: sft
do_train: true
finetuning_type: full

deepspeed: examples/deepspeed/ds_z2_config.json  # options: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

# Dataset configuration
dataset: BAAI-Infinity-Instruct-0625
template: llama3
cutoff_len: 4096
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16

# Output configuration
output_dir: saves_limo/llama3-1b/full/sft
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

# Training parameters
per_device_train_batch_size: 16
gradient_accumulation_steps: 4
learning_rate: 2.0e-05
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
