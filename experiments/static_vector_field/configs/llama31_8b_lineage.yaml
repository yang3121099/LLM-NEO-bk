# Static post-training vector-field audit — Llama-3.1-8B lineage.
#
# Base   -> SFT -> DPO -> RLVR maps onto the Tulu-3 8B release:
#   base : meta-llama/Llama-3.1-8B
#   sft  : allenai/Llama-3.1-Tulu-3-8B-SFT
#   dpo  : allenai/Llama-3.1-Tulu-3-8B-DPO
#   rlvr : allenai/Llama-3.1-Tulu-3-8B
#
# `path` may be a local directory OR a HuggingFace Hub repo id. Hub repos are
# fetched on demand (only *.safetensors / *.json) via snapshot_download, using
# your `huggingface-cli login` cache or the HF_TOKEN env var for auth.
#
# NOTE: meta-llama/Llama-3.1-8B is a *gated* model — accept its license on the Hub
# (https://huggingface.co/meta-llama/Llama-3.1-8B) with the same account whose
# token you log in with, or the download will 403. Optionally pin a commit with
# `revision: <sha>`.

lineage:
  - name: base
    path: meta-llama/Llama-3.1-8B
  - name: sft
    path: allenai/Llama-3.1-Tulu-3-8B-SFT
  - name: dpo
    path: allenai/Llama-3.1-Tulu-3-8B-DPO
  - name: rlvr
    path: allenai/Llama-3.1-Tulu-3-8B

output_dir: outputs/static_vector_field/llama31_8b

dtype: float32

# device: cpu (default) or cuda. This audit is largely I/O bound (it streams the
# checkpoint shards), so a GPU only accelerates the per-tensor reductions — expect
# a moderate speedup, mostly on fast NVMe storage. With device: cuda the per-tensor
# dot/norm/abs/sign/top-k run on the GPU while cross-tensor sums stay float64 on
# the host. reduce_dtype sets the on-device reduction precision (float32 is much
# faster than float64 on consumer GPUs; switch to float64 if you need it).
device: cpu
reduce_dtype: float32
eps: 1.0e-12

granularities:
  - global
  - layer
  - module
  - layer_module
  - submodule
  - depth_bin

depth_bins:
  shallow: [0, 10]
  middle: [11, 20]
  deep: [21, 31]

ignore_regex:
  - ".*rotary_emb.*"
  - ".*inv_freq.*"

include_non_floating: false

topk:
  enabled: true
  k_fraction: 0.001
  min_k: 1000
  max_k: 100000

rollback:
  enabled: true
  target: rlvr
  granularity: layer_module
  stages:
    - dpo
    - rlvr
  strategy: residual_to_chord
  top_fraction: 0.2
  rho_max: 0.5
  save_full_checkpoint: false
  save_delta_only: true
